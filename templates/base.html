<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Мій блог{% endblock %}</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: #e5e7eb;
    margin: 0;
}

header {
    background: #020617;
    padding: 10px 20px;
}

header a {
    color: #38bdf8;
    text-decoration: none;
    margin-right: 10px;
}

main {
    padding: 20px;
}

.post {
    background: #020617;
    padding: 15px;
    border-radius: 8px;
}

    </style>
</head>
<body>

<header>
    <h1><a href="{% url 'post_list' %}">🔥 Мій Django Блог</a></h1>
    <nav>
        <a href="{% url 'post_list' %}">Головна</a>
        <a href="#">Про мене</a>
    </nav>
</header>

<main>
    {% block content %}
    {% endblock %}
</main>

<footer>
    <p>© 2026 Мій блог на Django</p>
</footer>

</body>
</html>
