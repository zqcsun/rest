{% extends 'base.html' %}

{% block title %}Пости{% endblock %}

{% block content %}
<h2>Останні пости</h2>

{% for post in posts %}
<div class="post">
    <h3>
        <a href="#">
            {{ post.title }}
        </a>
    </h3>

    <p>{{ post.content|truncatewords:30 }}</p>
    <small>Опубліковано: {{ post.created_at }}</small>
</div>
<hr>
{% empty %}
<p>Постів ще немає 😢</p>
{% endfor %}

{% endblock %}
